<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Livros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>Catálogo de Livros</h1>
        <a href="menu.html" class="btn btn-light mt-2">Voltar ao menu</a>
    </header>

    <main class="container py-4">

        <input
            type="text"
            id="busca"
            class="form-control mb-3"
            placeholder="Buscar por título ou autor..."
        >

        <section class="row g-2 mb-4">
            <div class="col-md-4">
                <label for="genero" class="form-label">Gênero</label>
                <select id="genero" class="form-select">
                    <option value="todos">Todos</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="anoMin" class="form-label">Ano mínimo</label>
                <select id="anoMin" class="form-select">
                    <option value="todos">Qualquer ano</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="anoMax" class="form-label">Ano máximo</label>
                <select id="anoMax" class="form-select">
                    <option value="todos">Qualquer ano</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="ordenar" class="form-label">Ordenar por</label>
                <select id="ordenar" class="form-select">
                    <option value="padrao">Padrão</option>
                    <option value="nome">Nome</option>
                    <option value="ano">Ano</option>
                    <option value="avaliacao">Avaliação</option>
                </select>
            </div>
        </section>

        <p id="resultado"></p>

        <section id="livros" class="row g-4"></section>

    </main>

    <footer class="text-center py-3">
        <a href="emprestimos.html" class="btn btn-outline-dark">
            Minha lista
        </a>
    </footer>

    <script src="dados.js"></script>
    <script src="catalogo.js"></script>

</body>
</html>
