<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>Minha Lista</h1>

        <a href="catalogo.html" class="btn btn-light mt-2">
            Voltar ao catálogo
        </a>
    </header>

    <main class="container py-5">

        <section id="lista"></section>

        <hr>

        <section class="mt-4">
            <h2 class="h4">Código especial</h2>

            <p>
                Digite seu código para receber prioridade na fila de espera.
            </p>

            <input
                type="text"
                id="codigo"
                class="form-control mb-2"
                placeholder="Digite o código"
            >

            <button onclick="verificarCodigo()" class="btn btn-primary">
                Aplicar código
            </button>

            <p id="mensagem" class="mt-3"></p>
        </section>

    </main>

    <footer class="text-center py-3">
        <a href="menu.html" class="btn btn-outline-dark">
            Voltar ao menu
        </a>
    </footer>

    <script src="dados.js"></script>
    <script src="emprestimos.js"></script>

</body>
</html>
